<svg xmlns="http://www.w3.org/2000/svg" width="350" height="175" viewBox="0 0 350 175" role="img" aria-labelledby="title">
  <title id="title">Most used languages</title>
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, sans-serif; fill: #2f80ed; }
    .lang { font: 400 11px 'Segoe UI', Ubuntu, sans-serif; fill: #434d58; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="349" height="174" fill="#fffefe"/>
  <text x="25" y="35" class="title">Most Used Languages</text>
  <mask id="bar-mask"><rect x="25" y="55" width="300" height="8" rx="5" fill="white"/></mask>
  <g mask="url(#bar-mask)">
    <rect x="25.00" y="55" width="145.00" height="8" fill="#b07219"/>
    <rect x="170.00" y="55" width="62.98" height="8" fill="#3178c6"/>
    <rect x="232.98" y="55" width="42.29" height="8" fill="#4F5D95"/>
    <rect x="275.27" y="55" width="38.26" height="8" fill="#f7523f"/>
    <rect x="313.52" y="55" width="8.01" height="8" fill="#c6538c"/>
    <rect x="321.54" y="55" width="3.04" height="8" fill="#563d7c"/>
  </g>
  <g transform="translate(25, 90)">
      <circle cx="5" cy="-4" r="5" fill="#b07219"/>
      <text x="15" y="0" class="lang">Java 48.33%</text>
    </g>
    <g transform="translate(180, 90)">
      <circle cx="5" cy="-4" r="5" fill="#3178c6"/>
      <text x="15" y="0" class="lang">TypeScript 20.99%</text>
    </g>
    <g transform="translate(25, 115)">
      <circle cx="5" cy="-4" r="5" fill="#4F5D95"/>
      <text x="15" y="0" class="lang">PHP 14.10%</text>
    </g>
    <g transform="translate(180, 115)">
      <circle cx="5" cy="-4" r="5" fill="#f7523f"/>
      <text x="15" y="0" class="lang">Blade 12.75%</text>
    </g>
    <g transform="translate(25, 140)">
      <circle cx="5" cy="-4" r="5" fill="#c6538c"/>
      <text x="15" y="0" class="lang">SCSS 2.67%</text>
    </g>
    <g transform="translate(180, 140)">
      <circle cx="5" cy="-4" r="5" fill="#563d7c"/>
      <text x="15" y="0" class="lang">CSS 1.01%</text>
    </g>
</svg>
